<section [ngStyle]="rootComp" class="text-center container mt w-100 d-flex flex-column">
  <h1 *ngIf="mostrarElementos" class="col-0" font>Registro de Usuario</h1>

  <div class="row d-flex mt-3 gap-3 p-2" [formGroup]="registroForm" (ngSubmit)="registrar()">
    <label *ngIf="!mostrarElementos" class="h4 mb-1 col-0" style="color: #ffffff;">
      Mantente conectado con nosotros</label>

    <form class="needs-validation w-100" style="align-items: center;" novalidate>
      <div class="d-flex gap-3 w-100">
        <div class="flex-grow-1 text-start">
          <label [ngStyle]="labels" class="form-label">Cédula</label>
          <input type="text" class="form-control" formControlName="id" placeholder="Cédula" />
        </div>
        <div class="flex-grow-1 text-start">
          <label [ngStyle]="labels" class="form-label">Nombre</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Nombre" />
        </div>
      </div>

      <div class="d-flex gap-3 w-100">
        <div class="flex-grow-1 text-start">
          <label [ngStyle]="labels" class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="Email" />
        </div>
        <div class="flex-grow-1 text-start">
          <label [ngStyle]="labels" class="form-label">Teléfono</label>
          <input type="number" class="form-control" formControlName="phone" placeholder="Teléfono" />
        </div>
      </div>

      <div class="d-flex gap-3 w-100">
        <div class="flex-grow-1 text-start">
          <label [ngStyle]="labels" class="form-label">Dirección</label>
          <input type="text" class="form-control" formControlName="address" placeholder="Dirección" />
        </div>
        <div class="flex-grow-1 text-start">
          <label [ngStyle]="labels" class="form-label">Fecha de Nacimiento</label>
          <input type="date" class="form-control" formControlName="birthDate"  placeholder="Fecha Nacimiento"/>
        </div>
      </div>

      <div class="w-100 col-12 text-start">
        <label [ngStyle]="labels" class="form-label">Ocupación</label>
        <input type="text" class="form-control" formControlName="ocupation" placeholder="Ocupación" />
      </div>

      <div class="row mt-3 text-center">
        <div class="col-12">
          <a *ngIf="!mostrarElementos" routerLink="/signin">¿Ya tienes cuenta? <strong>Inicia Sesión</strong></a>
          <a *ngIf="mostrarElementos" class="ablack" routerLink="/signin">¿Ya tienes cuenta? <strong>Inicia
              Sesión</strong></a>
        </div>
      </div>

      <div class="row mt-3 text-center">
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Registrarse</button>
          <button *ngIf="mostrarElementos" class="btn button-cancel" type="button" (click)="volver()">Volver</button>
        </div>
      </div>
    </form>
    <div class="dropdown-dividers"></div>
  </div>
</section>
